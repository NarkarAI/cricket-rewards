[project]
name = "cricket-rewards-backend"
version = "1.0.0"
description = "Cricket Fan Rewards Platform - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "beanie>=1.23.0",
    "motor>=3.3.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "firebase-admin>=6.2.0",
    "stripe>=7.0.0",
    "razorpay>=1.4.0",
    "python-socketio>=5.10.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "aiosmtplib>=3.0.0",
    "twilio>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "mongomock-motor>=0.0.20",
    "ruff>=0.1.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
